<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>SIM V3 · 3D full-wave field (three.js)</title>
  <style>
    body { margin: 0; background: #0b0e14; color: #cfd8e3; font: 13px system-ui, sans-serif; overflow: hidden; }
    #hud { position: fixed; top: 10px; left: 12px; z-index: 10; line-height: 1.5;
           text-shadow: 0 1px 2px #000; }
    #hud b { color: #7ec8ff; }
    #err { color: #ff6b6b; }
  </style>
  <script type="importmap">
  { "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }}
  </script>
</head>
<body>
  <div id="hud">
    <div><b>SIM V3 — 3D full-wave field</b> (surrogate/FDTD), animated in three.js</div>
    <div id="meta">loading…</div>
    <div id="err"></div>
    <div style="opacity:.7">drag to orbit · scroll to zoom · Re{U·e<sup>jωt</sup>} sweep</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const $ = id => document.getElementById(id);
    try {
      const meta = await (await fetch('fw_field3d.json?t=' + Date.now())).json();
      const [X, Y, Z] = meta.dims, N = X * Y * Z;
      const data = new Float32Array(await (await fetch('fw_field3d.bin')).arrayBuffer());
      const re = data.subarray(0, N), im = data.subarray(N, 2 * N);
      const solid = new Uint8Array(await (await fetch('fw_field3d_solid.bin')).arrayBuffer());
      const idx = (x, y, z) => (x * Y + y) * Z + z;
      $('meta').innerHTML = `${meta.band} · ${meta.f_mhz} MHz · ${X}×${Y}×${Z} voxels`;

      // amplitude → threshold which cells to draw
      let amax = 0; const amp = new Float32Array(N);
      for (let i = 0; i < N; i++) { amp[i] = Math.hypot(re[i], im[i]); if (amp[i] > amax) amax = amax; amax = Math.max(amax, amp[i]); }
      const thr = 0.05 * amax;
      const cells = [];
      for (let x = 0; x < X; x++) for (let y = 0; y < Y; y++) for (let z = 0; z < Z; z++) {
        const i = idx(x, y, z); if (!solid[i] && amp[i] > thr) cells.push(i);
      }

      // scene
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(devicePixelRatio);
      document.body.appendChild(renderer.domElement);
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 5000);
      camera.position.set(X * 0.9, Y * 1.4, Z * 1.3);
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0, 0); controls.update();
      scene.add(new THREE.AmbientLight(0xffffff, 0.9));

      const cx = X / 2, cy = Y / 2, cz = Z / 2;
      // field voxels (instanced, per-frame colored by Re{U e^{jwt}})
      const g = new THREE.BoxGeometry(0.85, 0.85, 0.85);
      const mat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.9 });
      const field = new THREE.InstancedMesh(g, mat, cells.length);
      field.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(cells.length * 3), 3);
      const M = new THREE.Matrix4();
      cells.forEach((i, k) => {
        const z = i % Z, y = ((i - z) / Z) % Y, x = ((i - z) / Z - y) / Y;
        M.setPosition(x - cx, y - cy, z - cz); field.setMatrixAt(k, M);
      });
      scene.add(field);

      // walls (dim, static) — subsample to keep the count low
      const sc = []; for (let i = 0; i < N; i++) if (solid[i] && (i % 3 === 0)) sc.push(i);
      const wm = new THREE.MeshBasicMaterial({ color: 0x2a3340, transparent: true, opacity: 0.28 });
      const walls = new THREE.InstancedMesh(new THREE.BoxGeometry(0.9, 0.9, 0.9), wm, sc.length);
      sc.forEach((i, k) => { const z = i % Z, y = ((i - z) / Z) % Y, x = ((i - z) / Z - y) / Y; M.setPosition(x - cx, y - cy, z - cz); walls.setMatrixAt(k, M); });
      scene.add(walls);
      scene.add(new THREE.Mesh(new THREE.SphereGeometry(0.9), new THREE.MeshBasicMaterial({ color: 0x2fff6a }))
        .translateX(meta.tx[0] - cx).translateY(meta.tx[1] - cy).translateZ(meta.tx[2] - cz));

      const col = new THREE.Color();
      function animate(t) {
        const ph = (t * 0.00045) % 1, c = Math.cos(6.2832 * ph), s = Math.sin(6.2832 * ph);
        for (let k = 0; k < cells.length; k++) {
          const i = cells[k], v = (re[i] * c - im[i] * s) / amax;   // Re{U e^{jwt}}
          const a = Math.min(1, Math.abs(v) * 4.0);
          if (v >= 0) col.setRGB(0.12 + 0.88 * a, 0.14 * a, 0.10 * a);
          else col.setRGB(0.10 * a, 0.18 * a, 0.14 + 0.86 * a);
          field.setColorAt(k, col);
        }
        field.instanceColor.needsUpdate = true;
        controls.update(); renderer.render(scene, camera); requestAnimationFrame(animate);
      }
      addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
      requestAnimationFrame(animate);
    } catch (e) { $('err').textContent = 'error: ' + e.message; throw e; }
  </script>
</body>
</html>
