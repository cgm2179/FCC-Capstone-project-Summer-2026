<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>SIM V3 · full-wave on the 7th-floor CAD</title>
  <style>
    body { margin: 0; background: #0a0d13; color: #cfd8e3; font: 13px system-ui, sans-serif; overflow: hidden; }
    #hud { position: fixed; top: 10px; left: 12px; z-index: 10; line-height: 1.55; text-shadow: 0 1px 2px #000; }
    #hud b { color: #7ec8ff; } #err { color: #ff6b6b; }
    .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: middle; }
  </style>
  <script type="importmap">
  { "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }}
  </script>
</head>
<body>
  <div id="hud">
    <div><b>SIM V3 — full-wave field on the 7th-floor CAD</b> · smooth wave-mesh (Surface Nets)</div>
    <div id="meta">loading…</div>
    <div><span class="sw" style="background:#ff5a4a"></span> wavefront crest &nbsp;
         <span class="sw" style="background:#4aa0ff"></span> trough &nbsp;
         <span class="sw" style="background:#37d67a"></span> coverage shell</div>
    <div id="err"></div>
    <div style="opacity:.7">drag to orbit · scroll to zoom</div>
  </div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { surfaceNets } from './smooth_surface.js';
    const $ = id => document.getElementById(id);

    try {
      // ---- field ----
      const meta = await (await fetch('fw_floor.json?t=' + Date.now())).json();
      const [X, Y, Z] = meta.dims, NV = X * Y * Z;
      const buf = new Float32Array(await (await fetch('fw_floor.bin')).arrayBuffer());
      const re = buf.subarray(0, NV), im = buf.subarray(NV, 2 * NV);
      const solid = new Uint8Array(await (await fetch('fw_floor_solid.bin')).arrayBuffer());
      $('meta').innerHTML = `${meta.band} · ${meta.f_mhz} MHz · ${X}×${Y}×${Z} field · FDTD gen ${meta.gen_seconds}s`;

      // ---- scene ----
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(devicePixelRatio);
      document.body.appendChild(renderer.domElement);
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.01, 1e5);
      const controls = new OrbitControls(camera, renderer.domElement);
      scene.add(new THREE.AmbientLight(0xffffff, 0.75));
      const dl = new THREE.DirectionalLight(0xffffff, 0.7); dl.position.set(1, 2, 1); scene.add(dl);

      // ---- CAD (translucent shell so the field inside is visible; DRACO-compressed) ----
      let cmin, csz, center;
      try {
        const draco = new DRACOLoader();
        draco.setDecoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/');
        const loader = new GLTFLoader(); loader.setDRACOLoader(draco);
        const gltf = await loader.loadAsync('../Data/models/7th_floor_full.glb');
        gltf.scene.traverse(o => { if (o.isMesh) o.material = new THREE.MeshStandardMaterial(
          { color: 0xdfe6ee, transparent: true, opacity: 0.10, side: THREE.DoubleSide, depthWrite: false }); });
        scene.add(gltf.scene);
        const bb = new THREE.Box3().setFromObject(gltf.scene);
        cmin = bb.min; csz = new THREE.Vector3().subVectors(bb.max, bb.min);
        center = bb.getCenter(new THREE.Vector3());
      } catch (e) {                                   // field still renders if CAD fails
        const [ex, ey, ez] = meta.extent_m;
        cmin = new THREE.Vector3(0, 0, 0); csz = new THREE.Vector3(ex, ey, ez);
        center = new THREE.Vector3(ex / 2, ey / 2, ez / 2);
        $('meta').innerHTML += ' · (CAD unavailable — field only)';
      }
      camera.position.set(cmin.x + csz.x * 1.1, cmin.y + csz.y * 3.5, cmin.z + csz.z * 1.4);
      controls.target.copy(center); controls.update();

      // grid vertex (Surface-Nets frame) → world, mapped onto the CAD bbox
      const wx = v => cmin.x + (v / X) * csz.x, wy = v => cmin.y + (v / Y) * csz.y, wz = v => cmin.z + (v / Z) * csz.z;
      function isoGeom(scalar) {                     // scalar: x-fast, inside where <0
        const { vertices, faces } = surfaceNets(scalar, [X, Y, Z]);
        const pos = [];
        for (const f of faces) {
          const a = vertices[f[0]], b = vertices[f[1]], c = vertices[f[2]], d = vertices[f[3]];
          const W = p => [wx(p[0]), wy(p[1]), wz(p[2])];
          const A = W(a), Bv = W(b), C = W(c), D = W(d);
          pos.push(...A, ...Bv, ...C, ...A, ...C, ...D);
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        g.computeVertexNormals(); return g;
      }
      // signed field Re{U e^{jwt}} in x-fast order (solids → 0 so they're in no shell)
      function phaseV(ph) {
        const c = Math.cos(ph), s = Math.sin(ph), v = new Float32Array(NV);
        for (let x = 0; x < X; x++) for (let y = 0; y < Y; y++) for (let z = 0; z < Z; z++) {
          const iS = (x * Y + y) * Z + z, jN = x + X * (y + Y * z);
          v[jN] = solid[iS] ? 0 : (re[iS] * c - im[iS] * s);
        } return v;
      }

      // ---- coverage shell |U| (static, translucent) ----
      const amp = new Float32Array(NV);
      for (let x = 0; x < X; x++) for (let y = 0; y < Y; y++) for (let z = 0; z < Z; z++) {
        const iS = (x * Y + y) * Z + z, jN = x + X * (y + Y * z);
        amp[jN] = solid[iS] ? 0 : (0.15 - Math.hypot(re[iS], im[iS]));   // inside where |U|>0.15
      }
      scene.add(new THREE.Mesh(isoGeom(amp), new THREE.MeshStandardMaterial(
        { color: 0x37d67a, transparent: true, opacity: 0.16, side: THREE.DoubleSide, depthWrite: false })));

      // ---- precompute wavefront shells over one period ----
      const NPH = 14, L = 0.22, waves = [];
      const matC = new THREE.MeshStandardMaterial({ color: 0xff5a4a, emissive: 0x2c0a06, transparent: true, opacity: 0.9, side: THREE.DoubleSide });
      const matT = new THREE.MeshStandardMaterial({ color: 0x4aa0ff, emissive: 0x06182c, transparent: true, opacity: 0.9, side: THREE.DoubleSide });
      for (let p = 0; p < NPH; p++) {
        const v = phaseV(2 * Math.PI * p / NPH);
        const crest = v.map(x => L - x), trough = v.map(x => x + L);
        const grp = new THREE.Group();
        grp.add(new THREE.Mesh(isoGeom(crest), matC));
        grp.add(new THREE.Mesh(isoGeom(trough), matT));
        grp.visible = false; scene.add(grp); waves.push(grp);
        $('meta').innerHTML = `${meta.band} · ${meta.f_mhz} MHz · building wavefronts… ${p + 1}/${NPH}`;
      }
      $('meta').innerHTML = `${meta.band} · ${meta.f_mhz} MHz · ${X}×${Y}×${Z} · FDTD gen ${meta.gen_seconds}s`;

      let last = 0, k = 0;
      function animate(t) {
        if (t - last > 70) { waves[k].visible = false; k = (k + 1) % NPH; waves[k].visible = true; last = t; }
        controls.update(); renderer.render(scene, camera); requestAnimationFrame(animate);
      }
      addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
      requestAnimationFrame(animate);
    } catch (e) { $('err').textContent = 'error: ' + e.message; throw e; }
  </script>
</body>
</html>
