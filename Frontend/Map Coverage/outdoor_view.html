<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NoMa outdoor — walk on OSM (2D / 3D)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- base-station catalog (window.BASE_STATIONS) + the baked, tagged 7/24 outdoor walk +
       the 2D city-clutter raster for the outdoor path-loss sim (window.NOMA_CLUTTER) -->
  <script src="../Data/base_stations.js"></script>
  <script src="../Data/outdoor_walk.js"></script>
  <script src="../Data/noma_clutter.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
  }
  </script>
  <style>
    html, body { margin: 0; height: 100%; width: 100%; font-family: system-ui, sans-serif; background: #eef1f0; }
    #map2d, #map3d { position: absolute; inset: 0; width: 100%; height: 100%; }
    #map3d { display: none; }
    #bar { position: absolute; top: 10px; left: 10px; z-index: 500; display: flex; gap: 8px; align-items: center;
           background: rgba(255,255,255,.94); border-radius: 8px; padding: 7px 10px; box-shadow: 0 2px 10px rgba(0,0,0,.2);
           font-size: 13px; color: #223; flex-wrap: wrap; max-width: calc(100% - 20px); }
    #bar button { border: 1px solid #cbd5d1; background: #fff; border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
    #bar button.active { background: #0a7f7a; color: #fff; border-color: #0a7f7a; }
    #bar select { border: 1px solid #cbd5d1; border-radius: 6px; padding: 3px 6px; }
    #legend { position: absolute; bottom: 14px; left: 10px; z-index: 500; background: rgba(255,255,255,.94);
              border-radius: 8px; padding: 8px 10px; box-shadow: 0 2px 10px rgba(0,0,0,.2); font-size: 12px; color: #223; }
    #legend .ramp { height: 10px; width: 180px; border-radius: 3px; margin: 4px 0 2px;
                    background: linear-gradient(90deg, #0000ff, #00ffff, #00ff00, #ffff00, #ff0000); }
    #legend .lr { display: flex; justify-content: space-between; width: 180px; }
    #legend .fcc { color: #2c7fb8; font-weight: 600; }
    #filterNote { position: absolute; top: 10px; right: 10px; z-index: 500; background: rgba(10,18,36,.82); color: #dfe6f2;
                  border-radius: 8px; padding: 6px 10px; font-size: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.2); max-width: 260px; }
    #status3d { position: absolute; bottom: 14px; right: 12px; z-index: 500; display: none;
                background: rgba(10,18,36,.85); color: #dfe6f2; border-radius: 8px; padding: 6px 10px; font-size: 12px; }
  </style>
</head>
<body>
  <div id="map2d"></div>
  <div id="map3d"></div>
  <div id="bar">
    <span>View</span>
    <button id="btn2d" class="active" type="button">2D map</button>
    <button id="btn3d" type="button" title="Three.js outdoor view: rectangular OSM ground (Web Mercator) + base-station massing + walk points">3D map</button>
    <span style="margin-left:6px;">Focus</span>
    <select id="modelSel" title="Frame the whole NoMa walk, or zoom to the indoor FCC building">
      <option value="noma" selected>NoMa walk + OSM</option>
      <option value="indoor">Indoor building (FCC 7th floor)</option>
    </select>
    <button id="btnSim" type="button" title="2D path-loss over the rasterized city clutter, from a Tx (default FCC HQ; the selected PCI's base station when one is picked). Shows a predicts-vs-reality confidence score.">◈ Simulate 2D PL</button>
    <button id="btnSimOff" type="button" style="display:none;" title="Hide the coverage overlay">Clear</button>
    <span style="margin-left:6px;">Colors</span>
    <select id="colorSel" title="Colour scale for the walk dots and the sim coverage">
      <option value="rainbow" selected>Rainbow</option>
      <option value="viridis">Viridis</option>
    </select>
  </div>
  <div id="simScore" style="position:absolute; top:56px; right:10px; z-index:500; display:none; background:rgba(10,18,36,.9); color:#dfe6f2; border-radius:8px; padding:9px 12px; font-size:12px; box-shadow:0 2px 10px rgba(0,0,0,.25); max-width:280px; line-height:1.5;"></div>
  <div id="filterNote">Whole 7/24 walk · <span id="shownN">0</span> pts</div>
  <div id="legend">
    <div><span class="fcc">◉ FCC</span> (walk centre) · ▲ base stations</div>
    <div>7/24 walk — RSRP</div>
    <div class="ramp"></div>
    <div class="lr"><span>−120 dBm</span><span>−60 dBm</span></div>
  </div>
  <div id="status3d">3D idle</div>

  <script>
  'use strict';
  var W = window.OUTDOOR_WALK || { pts: [], ops: [], nets: [], bands: [], chs: [], fcc: { lon: -77.00740, lat: 38.90359 } };
  var FCC = W.fcc, FORTE = { lon: -77.011420, lat: 38.901550 };
  var BS = (window.BASE_STATIONS || []).filter(function (s) { return s.lat != null; });
  // reconstruct tagged points from the packed rows: [lon,lat,rsrp,pci,opIdx,netIdx,bandIdx,chIdx]
  var PTS = (W.pts || []).map(function (r) {
    return { lon: r[0], lat: r[1], rsrp: r[2], pci: r[3], op: W.ops[r[4]], net: W.nets[r[5]], band: W.bands[r[6]], ch: W.chs[r[7]] };
  });
  // active sidebar filter — '' / 'all' means no constraint on that dimension
  var filter = { operator: '', network: '', band: '', pci: '', channel: '' };
  function on(v) { return v && v !== 'all' && v !== 'All'; }
  function matches(p) {
    if (on(filter.operator) && p.op !== filter.operator) return false;
    if (on(filter.network) && p.net !== filter.network) return false;
    if (on(filter.band) && String(p.band) !== String(filter.band)) return false;
    if (on(filter.pci) && String(p.pci) !== String(filter.pci)) return false;
    if (on(filter.channel) && String(p.ch) !== String(filter.channel)) return false;
    return true;
  }
  function shown() { return PTS.filter(matches); }

  var colorScheme = 'rainbow';   // 'rainbow' | 'viridis' — applies to walk dots AND the sim coverage
  var RAMP = {
    rainbow: [[0, 0, 255], [0, 255, 255], [0, 255, 0], [255, 255, 0], [255, 0, 0]],
    viridis: [[68, 1, 84], [59, 82, 139], [33, 145, 140], [94, 201, 98], [253, 231, 37]],
  };
  function rsrpColor(v) {
    var t = Math.max(0, Math.min(1, (v + 120) / 60));
    var st = RAMP[colorScheme] || RAMP.rainbow;
    var x = t * (st.length - 1), i = Math.floor(x), f = x - i, a = st[i], b = st[Math.min(i + 1, st.length - 1)];
    return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * f) + ',' + Math.round(a[1] + (b[1] - a[1]) * f) + ',' + Math.round(a[2] + (b[2] - a[2]) * f) + ')';
  }
  function rsrpRGB(v) {
    var t = Math.max(0, Math.min(1, (v + 120) / 60));
    var st = RAMP[colorScheme] || RAMP.rainbow;
    var x = t * (st.length - 1), i = Math.floor(x), f = x - i, a = st[i], b = st[Math.min(i + 1, st.length - 1)];
    return [Math.round(a[0] + (b[0] - a[0]) * f), Math.round(a[1] + (b[1] - a[1]) * f), Math.round(a[2] + (b[2] - a[2]) * f)];
  }

  // ---------- 2D Leaflet ----------
  var map2d = L.map('map2d', { zoomControl: true, preferCanvas: true }).setView([FCC.lat, FCC.lon], 16);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution: '© OpenStreetMap · © CARTO', maxZoom: 20, subdomains: 'abcd' }).addTo(map2d);
  var walkLayer = L.layerGroup().addTo(map2d);
  function renderWalk2d() {
    walkLayer.clearLayers();
    var pts = shown(), n = 0;
    pts.forEach(function (p) {
      L.circleMarker([p.lat, p.lon], { radius: 3, stroke: false, fillColor: rsrpColor(p.rsrp), fillOpacity: 0.85 })
        .bindTooltip(p.op + ' · ' + p.net.toUpperCase() + ' B' + p.band + ' · PCI ' + p.pci + ' · RSRP ' + p.rsrp + ' dBm', { direction: 'top' })
        .addTo(walkLayer);
      n++;
    });
    document.getElementById('shownN').textContent = n;
  }
  BS.forEach(function (s) {
    L.circleMarker([s.lat, s.lon], {
      radius: 7, color: '#fff', weight: 2,
      fillColor: s.status === 'live' ? '#c0392b' : '#7f8c8d', fillOpacity: 1
    }).bindPopup('<b>' + s.name + '</b><br>' + (s.building_height_m || '?') + ' m').addTo(map2d);
  });
  L.circleMarker([FCC.lat, FCC.lon], { radius: 9, color: '#fff', weight: 2, fillColor: '#2c7fb8', fillOpacity: 1 })
    .bindTooltip('FCC — 7th-floor walk centre', { direction: 'right' }).addTo(map2d);
  renderWalk2d();

  // ---------- view toggle + focus + sidebar filter ----------
  // Outdoor 3D is the Three.js scene below (OSM ground + BS massing). OSM Buildings / Unity
  // C# city views were removed — they were unreliable here and duplicated the Simulation Unity toggle.
  function is3d() { return getComputedStyle(document.getElementById('map3d')).display !== 'none'; }
  function applyFilter() {
    renderWalk2d();
    if (is3d() && window.__outdoor3d && window.__outdoor3d.rebuildWalk) window.__outdoor3d.rebuildWalk();
  }
  function show(which) {
    var d3 = which === '3d';
    document.getElementById('map2d').style.display = d3 ? 'none' : 'block';
    document.getElementById('map3d').style.display = d3 ? 'block' : 'none';
    document.getElementById('status3d').style.display = d3 ? 'block' : 'none';
    document.getElementById('btn2d').classList.toggle('active', !d3);
    document.getElementById('btn3d').classList.toggle('active', d3);
    if (d3) {
      if (window.__outdoor3d && window.__outdoor3d.ensure) window.__outdoor3d.ensure();
    } else {
      setTimeout(function () { map2d.invalidateSize(); }, 60);
    }
    if (window.simReRender) window.simReRender();
  }
  document.getElementById('btn2d').addEventListener('click', function () { show('2d'); });
  document.getElementById('btn3d').addEventListener('click', function () { show('3d'); });
  document.getElementById('modelSel').addEventListener('change', function (e) {
    var indoor = e.target.value === 'indoor';
    if (!is3d()) map2d.setView([FCC.lat, FCC.lon], indoor ? 18 : 16);
    else if (window.__outdoor3d && window.__outdoor3d.focus) window.__outdoor3d.focus(indoor ? 'indoor' : 'noma');
  });

  // Parent (dashboard sidebar) → filter the outdoor dots.
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.source !== 'outdoorFilter') return;
    filter = { operator: d.operator || '', network: d.network || '', band: d.band || '', pci: d.pci || '', channel: d.channel || '' };
    var active = ['operator', 'network', 'band', 'pci', 'channel'].filter(function (k) { return on(filter[k]); })
      .map(function (k) { return k + '=' + filter[k]; });
    document.getElementById('filterNote').firstChild.textContent = (active.length ? active.join(' · ') : 'Whole 7/24 walk') + ' · ';
    applyFilter();
  });

  // expose the facets so the parent can populate the sidebar options for outdoor mode
  window.__outdoorView = { n: PTS.length, bsN: BS.length, fcc: FCC, facets: (W.facets || {}), setFilter: function (f) { filter = f; applyFilter(); } };
  try { window.parent && window.parent.postMessage({ source: 'outdoorReady', facets: (W.facets || {}) }, '*'); } catch (e) {}
  </script>

  <script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  // EPSG:3857 / Pseudo-Mercator — outdoor 3D world units are metres on this plane.
  const R = 6378137;
  const lonLatToMerc = (lon, lat) => {
    const x = R * lon * Math.PI / 180;
    const y = R * Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360));
    return { x, y };
  };

  const host = document.getElementById('map3d');
  const statusEl = document.getElementById('status3d');
  let renderer, scene, camera, controls, walkPoints = null, root = null, ready = false;
  let origin = { x: 0, y: 0 };   // mercator origin (scene 0,0)

  function setStatus(msg) { if (statusEl) statusEl.textContent = msg || ''; }

  function walkBounds() {
    let minLon = FCC.lon, maxLon = FCC.lon, minLat = FCC.lat, maxLat = FCC.lat;
    const grow = (lon, lat) => {
      if (!Number.isFinite(lon) || !Number.isFinite(lat)) return;
      if (lon < minLon) minLon = lon; if (lon > maxLon) maxLon = lon;
      if (lat < minLat) minLat = lat; if (lat > maxLat) maxLat = lat;
    };
    for (const p of PTS) grow(p.lon, p.lat);
    for (const b of BS) grow(b.lon, b.lat);
    // ~5% pad so the rectangular OSM ground isn't clipped at the walk edge
    const dLon = Math.max(1e-5, (maxLon - minLon) * 0.05);
    const dLat = Math.max(1e-5, (maxLat - minLat) * 0.05);
    return { minLon: minLon - dLon, maxLon: maxLon + dLon, minLat: minLat - dLat, maxLat: maxLat + dLat };
  }

  function toLocal(lon, lat) {
    const m = lonLatToMerc(lon, lat);
    return { x: m.x - origin.x, z: -(m.y - origin.y) };  // three.js: +Z toward viewer; flip N→−Z
  }

  async function buildOsmGround(group, bounds) {
    const sw = lonLatToMerc(bounds.minLon, bounds.minLat);
    const ne = lonLatToMerc(bounds.maxLon, bounds.maxLat);
    const mxMin = sw.x, mxMax = ne.x, myMin = sw.y, myMax = ne.y;
    const worldPx = (z) => 256 * Math.pow(2, z);
    const gW = (z) => (mxMax - mxMin) / (2 * 20037508.342789244) * worldPx(z);
    const gH = (z) => (myMax - myMin) / (2 * 20037508.342789244) * worldPx(z);
    let z = 18;
    while (z > 12 && (gW(z) > 2400 || gH(z) > 2400 ||
                      (Math.ceil(gW(z) / 256) + 1) * (Math.ceil(gH(z) / 256) + 1) > 72)) z--;
    const WP = worldPx(z), TM = 2 * 20037508.342789244 / WP;
    const merc2gx = (mx) => (mx + 20037508.342789244) / (2 * 20037508.342789244) * WP;
    const merc2gy = (my) => (20037508.342789244 - my) / (2 * 20037508.342789244) * WP;
    const nTiles = Math.pow(2, z);
    const tx0 = Math.floor(merc2gx(mxMin) / 256), tx1 = Math.floor(merc2gx(mxMax) / 256);
    const ty0 = Math.floor(merc2gy(myMax) / 256), ty1 = Math.floor(merc2gy(myMin) / 256);

    // Canvas is a full rectangle matching the walk extent (no sliced right edge).
    const aspect = (mxMax - mxMin) / Math.max(1e-6, myMax - myMin);
    const CW = Math.min(4096, Math.max(2048, Math.round(gW(z))));
    const CH = Math.max(1, Math.round(CW / aspect));
    const canvas = document.createElement('canvas'); canvas.width = CW; canvas.height = CH;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#e9edf0'; ctx.fillRect(0, 0, CW, CH);

    const jobs = [];
    for (let tx = tx0; tx <= tx1; tx++) for (let ty = ty0; ty <= ty1; ty++) {
      if (ty < 0 || ty >= nTiles) continue;
      const nx = ((tx % nTiles) + nTiles) % nTiles;
      const mx0 = tx * 256 * TM - 20037508.342789244;
      const my0 = 20037508.342789244 - ty * 256 * TM;
      jobs.push({ nx, ty, mx0, my0 });
    }

    const sx = CW / (mxMax - mxMin), sy = CH / (myMax - myMin);
    let tex = null, any = false, remaining = jobs.length, idx = 0, active = 0;
    const subd = ['a', 'b', 'c'], MAX_ACTIVE = 5;
    const place = () => {
      if (!tex) {
        tex = new THREE.CanvasTexture(canvas);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.minFilter = THREE.LinearFilter; tex.magFilter = THREE.LinearFilter;
        const w = mxMax - mxMin, d = myMax - myMin;
        const mesh = new THREE.Mesh(
          new THREE.PlaneGeometry(w, d),
          new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0.96, depthWrite: false }));
        mesh.rotation.x = -Math.PI / 2;
        const c = toLocal((bounds.minLon + bounds.maxLon) / 2, (bounds.minLat + bounds.maxLat) / 2);
        // Plane local X = +mercX, local Y (before rot) = +mercY → after rot.x=-90°, +Y maps to −Z in our flip.
        // With our toLocal z = -(my-origin), plane depth axis should be merc-Y magnitude along world −Z,
        // so leave PlaneGeometry unflipped in UV and position at the mercator centre.
        mesh.position.set(c.x, 0.02, c.z);
        mesh.name = '__osmGround';
        group.add(mesh);
      } else tex.needsUpdate = true;
    };
    const drawTile = (img, j) => {
      // tile (u,v) → merc → canvas: x right, y down
      const x = (j.mx0 - mxMin) * sx;
      const y = (myMax - j.my0) * sy;
      ctx.setTransform(sx * TM, 0, 0, sy * TM, x, y);
      ctx.drawImage(img, -0.5, -0.5, 257, 257);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    };
    await new Promise((resolve) => {
      const finish = () => { place(); resolve(); };
      if (!jobs.length) { finish(); return; }
      const startJob = (j, attempt) => {
        const img = new Image(); img.crossOrigin = 'anonymous';
        img.onload = () => { any = true; drawTile(img, j); place(); active--; if (--remaining === 0) finish(); pump(); };
        img.onerror = () => {
          if (attempt < 2) { setTimeout(() => startJob(j, attempt + 1), 350 + 250 * attempt); return; }
          active--; if (--remaining === 0) finish(); pump();
        };
        img.src = `https://${subd[(j.nx + j.ty) % 3]}.tile.openstreetmap.org/${z}/${j.nx}/${j.ty}.png`;
      };
      const pump = () => { while (active < MAX_ACTIVE && idx < jobs.length) { active++; startJob(jobs[idx++], 0); } };
      pump();
    });
    setStatus(any
      ? `3D map · OSM ground z${z} · ${jobs.length} tiles · drag to orbit`
      : '3D map · OSM tiles unavailable — grey ground (offline?)');
  }

  function addBaseStations(group) {
    for (const b of BS) {
      const p = toLocal(b.lon, b.lat);
      const h = Math.max(Number.isFinite(b.building_height_m) ? b.building_height_m : 20, 4);
      const live = b.status === 'live';
      const fp = 16;
      const box = new THREE.Mesh(
        new THREE.BoxGeometry(fp, h, fp),
        new THREE.MeshStandardMaterial({ color: live ? 0x8f9ba8 : 0xbfb4ab, transparent: true, opacity: 0.55, roughness: 0.9 }));
      box.position.set(p.x, h / 2, p.z);
      group.add(box);
      const r = 4.5;
      const dot = new THREE.Mesh(
        new THREE.SphereGeometry(r, 20, 16),
        new THREE.MeshStandardMaterial({ color: live ? 0xc0392b : 0x7f8c8d, roughness: 0.45 }));
      dot.position.set(p.x, h + r, p.z);
      group.add(dot);
    }
  }

  function addFccBuilding(group) {
    // 6 storeys × 4.5 m under the 7th floor → 27 m slab; 7th floor ~4.5 m on top → ~31.5 m massing.
    const FLOOR_M = 4.5, FLOORS = 7;
    const h = FLOOR_M * FLOORS;
    const p = toLocal(FCC.lon, FCC.lat);
    const fw = 80, fd = 36;
    const massing = new THREE.Mesh(
      new THREE.BoxGeometry(fw, h, fd),
      new THREE.MeshStandardMaterial({ color: 0xaeb9c4, transparent: true, opacity: 0.32, roughness: 0.92, depthWrite: false }));
    massing.position.set(p.x, h / 2, p.z);
    group.add(massing);
    const edges = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.BoxGeometry(fw, h, fd)),
      new THREE.LineBasicMaterial({ color: 0x2c7fb8, transparent: true, opacity: 0.55 }));
    edges.position.copy(massing.position);
    group.add(edges);
    // Marker on the 7th-floor roof
    const roof = new THREE.Mesh(
      new THREE.SphereGeometry(3.5, 16, 12),
      new THREE.MeshStandardMaterial({ color: 0x2c7fb8, roughness: 0.4 }));
    roof.position.set(p.x, h + 3.5, p.z);
    group.add(roof);
  }

  function rebuildWalk() {
    if (!scene || !root) return;
    if (walkPoints) {
      root.remove(walkPoints);
      walkPoints.geometry.dispose();
      walkPoints.material.dispose();
      walkPoints = null;
    }
    const pts = shown();
    const step = Math.max(1, Math.ceil(pts.length / 6000));
    const positions = [];
    const colors = [];
    for (let i = 0; i < pts.length; i += step) {
      const p = pts[i];
      const loc = toLocal(p.lon, p.lat);
      positions.push(loc.x, 2.2, loc.z);
      const c = rsrpRGB(p.rsrp);
      colors.push(c[0] / 255, c[1] / 255, c[2] / 255);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    walkPoints = new THREE.Points(geo, new THREE.PointsMaterial({
      size: 4.5, sizeAttenuation: true, vertexColors: true, transparent: true, opacity: 0.9
    }));
    walkPoints.name = '__walk';
    root.add(walkPoints);
    document.getElementById('shownN').textContent = pts.length;
  }

  function frameTo(focus) {
    if (!camera || !controls) return;
    const indoor = focus === 'indoor';
    const target = toLocal(FCC.lon, FCC.lat);
    const h = indoor ? 80 : 420;
    const back = indoor ? 120 : 700;
    controls.target.set(target.x, indoor ? 20 : 0, target.z);
    camera.position.set(target.x + back * 0.55, h, target.z + back * 0.75);
    controls.update();
  }

  async function ensure() {
    if (ready) {
      renderer.setSize(host.clientWidth || 900, host.clientHeight || 640);
      rebuildWalk();
      return;
    }
    setStatus('Building 3D outdoor scene…');
    const w = host.clientWidth || 900, h = host.clientHeight || 640;
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    host.appendChild(renderer.domElement);

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xeef3f1);
    camera = new THREE.PerspectiveCamera(45, w / h, 1, 20000);
    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI * 0.49;

    scene.add(new THREE.AmbientLight(0xffffff, 0.75));
    const sun = new THREE.DirectionalLight(0xffffff, 0.85);
    sun.position.set(200, 400, 120);
    scene.add(sun);

    const bounds = walkBounds();
    const c = lonLatToMerc((bounds.minLon + bounds.maxLon) / 2, (bounds.minLat + bounds.maxLat) / 2);
    origin = { x: c.x, y: c.y };

    root = new THREE.Group();
    scene.add(root);

    // Street-level ground plane (grey underlay) so a missing tile never "slices" the rectangle.
    {
      const sw = lonLatToMerc(bounds.minLon, bounds.minLat);
      const ne = lonLatToMerc(bounds.maxLon, bounds.maxLat);
      const gw = ne.x - sw.x, gd = ne.y - sw.y;
      const under = new THREE.Mesh(
        new THREE.PlaneGeometry(gw, gd),
        new THREE.MeshBasicMaterial({ color: 0xd7dde2 }));
      under.rotation.x = -Math.PI / 2;
      under.position.y = -0.05;
      root.add(under);
    }

    await buildOsmGround(root, bounds);
    addBaseStations(root);
    addFccBuilding(root);
    rebuildWalk();
    frameTo(document.getElementById('modelSel').value === 'indoor' ? 'indoor' : 'noma');

    const tick = () => {
      if (getComputedStyle(host).display === 'none') { requestAnimationFrame(tick); return; }
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    };
    tick();
    window.addEventListener('resize', () => {
      if (!renderer) return;
      const ww = host.clientWidth || 900, hh = host.clientHeight || 640;
      camera.aspect = ww / hh; camera.updateProjectionMatrix();
      renderer.setSize(ww, hh);
    });
    ready = true;
  }

  window.__outdoor3d = {
    ensure,
    rebuildWalk,
    focus: (which) => frameTo(which),
  };
  </script>

  <script>
  'use strict';
  // ---------- Outdoor 2D path-loss sim over the rasterized city clutter ----------
  var CL = window.NOMA_CLUTTER, clut = null, CNX = 0, CNZ = 0, CELL = 3;
  if (CL) {
    CNX = CL.nx; CNZ = CL.nz; CELL = CL.cell_m;
    var raw = atob(CL.grid_b64); clut = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) clut[i] = raw.charCodeAt(i);
  }
  function isBldg(x, z) { if (x < 0 || x >= CNX || z < 0 || z >= CNZ) return false; var i = x * CNZ + z; return (clut[i >> 3] >> (7 - (i & 7))) & 1; }
  // grid <-> lon/lat (corners: x0z0=SE, x1z0=SW, x0z1=NE). x↑ ⇒ west, z↑ ⇒ north.
  var lonE = CL ? CL.corners.x0z0[0] : 0, lonW = CL ? CL.corners.x1z0[0] : 0;
  var latS = CL ? CL.corners.x0z0[1] : 0, latN = CL ? CL.corners.x0z1[1] : 0;
  function toGrid(lon, lat) { return { x: (lonE - lon) / (lonE - lonW) * (CNX - 1), z: (lat - latS) / (latN - latS) * (CNZ - 1) }; }

  var EIRP = 62, PL0 = 55, D0 = 10, N_EXP = 3.2, WALL_DB = 8, WALL_CAP = 60;
  var PLgrid = null;
  function solve2D(txx, txz) {
    PLgrid = new Float32Array(CNX * CNZ);
    for (var x = 0; x < CNX; x++) for (var z = 0; z < CNZ; z++) {
      var dx = x - txx, dz = z - txz, d = Math.max(D0, Math.hypot(dx, dz) * CELL);
      var steps = Math.max(Math.abs(dx), Math.abs(dz)), cross = 0;
      if (steps > 0) {
        var sx = dx / steps, sz = dz / steps, cx = txx, cz = txz, was = false;
        for (var k = 1; k <= steps; k++) { cx += sx; cz += sz; var b = isBldg(Math.round(cx), Math.round(cz)); if (b && !was) cross++; was = b; }
      }
      PLgrid[x * CNZ + z] = PL0 + 10 * N_EXP * Math.log10(d / D0) + Math.min(WALL_CAP, cross * WALL_DB);
    }
  }
  function samplePL(lon, lat) { if (!PLgrid) return null; var g = toGrid(lon, lat), x = Math.round(g.x), z = Math.round(g.z); if (x < 0 || x >= CNX || z < 0 || z >= CNZ) return null; return PLgrid[x * CNZ + z]; }

  var covLayer = null, txMarker = null;
  function renderCoverage() {
    if (!PLgrid) return;
    var cv = document.createElement('canvas'); cv.width = CNX; cv.height = CNZ;
    var ctx = cv.getContext('2d'), img = ctx.createImageData(CNX, CNZ);
    for (var py = 0; py < CNZ; py++) for (var px = 0; px < CNX; px++) {
      var x = CNX - 1 - px, z = CNZ - 1 - py;
      var c = rsrpRGB(EIRP - PLgrid[x * CNZ + z]), o = (py * CNX + px) * 4;
      img.data[o] = c[0]; img.data[o + 1] = c[1]; img.data[o + 2] = c[2]; img.data[o + 3] = isBldg(x, z) ? 60 : 150;
    }
    ctx.putImageData(img, 0, 0);
    if (covLayer) map2d.removeLayer(covLayer);
    covLayer = L.imageOverlay(cv.toDataURL(), [[latS, lonW], [latN, lonE]], { opacity: 0.6, interactive: false }).addTo(map2d);
  }
  // Coverage overlay stays on the 2D map; 3D outdoor is the OSM + massing scene (no OSM Buildings drape).
  function renderCoverageActive() { if (!PLgrid) return; renderCoverage(); if (!is3d()) return; }
  window.simReRender = function () { if (PLgrid) renderCoverageActive(); };

  function spearman(a, b) {
    var n = a.length; if (n < 3) return NaN;
    function ranks(arr) { var ix = arr.map(function (v, i) { return [v, i]; }).sort(function (p, q) { return p[0] - q[0]; }); var r = new Array(arr.length);
      for (var i = 0; i < ix.length;) { var j = i; while (j + 1 < ix.length && ix[j + 1][0] === ix[i][0]) j++; var avg = (i + j) / 2 + 1; for (var k = i; k <= j; k++) r[ix[k][1]] = avg; i = j + 1; } return r; }
    var ra = ranks(a), rb = ranks(b), ma = 0, mb = 0;
    for (var i = 0; i < n; i++) { ma += ra[i]; mb += rb[i]; } ma /= n; mb /= n;
    var num = 0, da = 0, db = 0;
    for (var i = 0; i < n; i++) { var x = ra[i] - ma, y = rb[i] - mb; num += x * y; da += x * x; db += y * y; }
    return (da && db) ? num / Math.sqrt(da * db) : NaN;
  }
  function baseStationForPci(pci) { for (var i = 0; i < BS.length; i++) { var s = BS[i]; if ((s.sectors || []).some(function (se) { return String(se.pci) === String(pci); })) return s; } return null; }
  function quality(r) { if (isNaN(r)) return ['n/a', '#888']; if (r >= 0.8) return ['Excellent', '#8cff8c']; if (r >= 0.6) return ['Good', '#40d840']; if (r >= 0.4) return ['Fair', '#ffe23f']; if (r >= 0.2) return ['Weak', '#ff9a1a']; return ['Poor', '#ff5a5a']; }
  function showScore(s) {
    var el = document.getElementById('simScore');
    if (!s) { el.style.display = 'none'; return; }
    var q = quality(s.rho);
    el.style.display = 'block';
    el.innerHTML = '<b>2D path-loss confidence</b><br>Tx: ' + s.tx + '<br>' +
      (s.pci ? ('PCI ' + s.pci + ' · n=' + s.n + ' walk pts<br>predicted vs measured RSRP<br>Spearman ρ = <b style="color:' + q[1] + '">' + (isNaN(s.rho) ? 'n/a' : s.rho.toFixed(2)) + '</b> · <span style="color:' + q[1] + '">' + q[0] + '</span>')
                : 'Pick a PCI in the sidebar to score predicted vs measured.');
  }

  function runSim() {
    if (!CL) { showScore({ tx: 'no clutter raster', pci: null }); return; }
    var pci = filter.pci, site = on(pci) ? baseStationForPci(pci) : null;
    var txLL = site ? { lon: site.lon, lat: site.lat } : { lon: FCC.lon, lat: FCC.lat };
    var g = toGrid(txLL.lon, txLL.lat);
    document.getElementById('btnSim').textContent = '◈ Solving…';
    setTimeout(function () {
      solve2D(Math.round(g.x), Math.round(g.z));
      renderCoverageActive();
      if (txMarker) map2d.removeLayer(txMarker);
      txMarker = L.marker([txLL.lat, txLL.lon]).addTo(map2d).bindTooltip('Tx · ' + (site ? site.name : 'FCC HQ (default)'), { permanent: false, direction: 'top' });
      var s = { tx: site ? site.name : 'FCC HQ (default)', pci: on(pci) ? pci : null, n: 0, rho: NaN };
      if (on(pci)) {
        var pred = [], meas = [];
        PTS.forEach(function (p) { if (String(p.pci) === String(pci)) { var pl = samplePL(p.lon, p.lat); if (pl != null) { pred.push(EIRP - pl); meas.push(p.rsrp); } } });
        s.n = pred.length; s.rho = spearman(pred, meas);
      }
      showScore(s);
      document.getElementById('btnSim').textContent = '◈ Simulate 2D PL';
      document.getElementById('btnSimOff').style.display = '';
    }, 30);
  }
  function clearSim() {
    if (covLayer) { map2d.removeLayer(covLayer); covLayer = null; }
    if (txMarker) { map2d.removeLayer(txMarker); txMarker = null; }
    PLgrid = null; showScore(null); document.getElementById('btnSimOff').style.display = 'none';
  }

  document.getElementById('btnSim').addEventListener('click', runSim);
  document.getElementById('btnSimOff').addEventListener('click', clearSim);

  document.getElementById('colorSel').addEventListener('change', function (e) {
    colorScheme = e.target.value;
    renderWalk2d();
    if (is3d() && window.__outdoor3d && window.__outdoor3d.rebuildWalk) window.__outdoor3d.rebuildWalk();
    if (PLgrid) renderCoverageActive();
    var lg = document.querySelector('#legend .ramp');
    if (lg) lg.style.background = 'linear-gradient(90deg,' + (RAMP[colorScheme] || RAMP.rainbow).map(function (c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }).join(',') + ')';
  });
  </script>
